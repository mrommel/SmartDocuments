{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Smart Documents{% endblock %} · Smart Documents</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'documents/favicon.svg' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="{% static 'documents/site.css' %}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand navbar-light border-bottom bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="{% url 'dashboard' %}">▤ Smart Documents</a>
        <div class="ms-auto d-flex gap-2">
            <a class="btn btn-outline-primary btn-sm" href="{% url 'dashboard' %}">Projects</a>
            <a class="btn btn-primary btn-sm" href="{% url 'project_create' %}">New project</a>
        </div>
    </div>
</nav>
<main class="container py-5">
    {% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}" role="alert">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
</main>
<footer class="container text-muted small pb-4">Your documents, organized by project.</footer>
</body>
</html>
